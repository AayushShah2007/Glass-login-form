<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-image: url(https://wallpapercave.com/wp/wp4680554.jpg);
            background-size: 100% 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Boldonse", system-ui;
            font-weight: 400;
            font-style: normal;
        }

        .card {
            width: 500px;
            height: 600px;
            background-color: rgba(255, 255, 255, 0);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            display: table-column;
        }

        .head {
            text-align: center;
            color: white;
            font-size: 30px;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        .contents {
            margin-left: auto;
            margin-right: auto;
            width: 70%;
            /* border: 2px solid black; */
            height: 500px;

            input {
                width: 345px;
                height: 40px;
                border-radius: 15px;
                margin-top: 20px;

                background-color: rgba(255, 255, 255, 0.108);
                border: none;
                outline: none;
            }
        }

        input::placeholder {
            color: white;
            /* padding-left: 30px; */
            font-family: 'Courier New', Courier, monospace;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: rgb(239, 6, 208);
            cursor: pointer;
        }

        .btn1 {
            text-indent: 50px;
            background-image: url(icons8-user-50.png);
            background-repeat: no-repeat;
            background-size: 30px 30px;
            background-position: 10px;
        }

        .btn2 {
            text-indent: 50px;
            background-image: url(icons8-lock-30.png);
            background-repeat: no-repeat;
            background-size: 30px 30px;
            background-position: 10px;
            margin-bottom: 20px;
        }

        .forgot {
            color: white;
        }

        .google {
            margin-top: 30px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.12);
            color: white;
            align-items: center;
            text-align: center;
            border-radius: 10px;

            img {
                width: 30px;
                margin-top: 4px;
            }

            .text {
                margin-left: 10px;
            }

            .cent {
                width: fit-content;
                display: flex;
                align-items: center;
                margin-left: auto;
                margin-right: auto;
            }
        }
        .facebook {
            margin-top: 20px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.12);
            color: white;
            align-items: center;
            text-align: center;
            border-radius: 10px;

            img {
                width: 30px;
                margin-top: 4px;
            }

            .text{
                margin-left: 10px;
            }

            .cent {
                width: fit-content;
                display: flex;
                align-items: center;
                margin-left: auto;
                margin-right: auto;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="head">Log in</div>
        <div class="contents">
            <input type="text" placeholder="Username" class="btn1">
            <input type="text" placeholder="Password" class="btn2">
            <input type="button" value="SUBMIT"
                style="background-color: rgba(255, 68, 0, 0.445); color: white; font-size: 20px; font-weight: bold;">
            <div class="forgot">
                <input type="checkbox" class="check"> <span>Remember me</span>
            </div>
            <div class="option">
                <div class="google">
                    <div class="cent">
                        <div class="icon">
                            <img src="icons8-google-50.png" alt="">
                        </div>
                        <div class="text">
                            Google Login
                        </div>
                    </div>
                </div>
                <div class="facebook">
                    <div class="cent">
                        <div class="icon">
                            <img src="icons8-facebook-48.png" alt="">
                        </div>
                        <div class="text">
                            Facebook Login
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>
</body>

</html>
